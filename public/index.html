    /* --- Dedicated Hard Revision Mode --- */
    window.isHardRevisionActive = false;

    function toAlphaSnippet(str) {
      return (str || '')
        .split('\n')
        .filter(l => !/^\s*\|?\s*:?-+:?\s*\|/.test(l))
        .join(' ')
        .toLowerCase()
        .replace(/[^a-z0-9]/g, ' ')
        .replace(/\s+/g, ' ')
        .trim();
    }

    function getAlphaWordCoverage(needleAlpha, haystackAlpha) {
      if (!needleAlpha) return 1.0;
      const nWords = needleAlpha.split(' ').filter(w => w.length > 0);
      if (nWords.length === 0) return 1.0;
      let matched = 0;
      for (const w of nWords) {
        if (haystackAlpha.includes(w)) matched++;
      }
      return matched / nWords.length;
    }

    // Shared snippet matcher for both Hard Revision rendering and normal-page ordering
    function analyzeRevisionSnippet(snippet, topic, conceptNum) {
      const snippetAlpha = toAlphaSnippet(snippet);
      if (!topic || !snippetAlpha) return null;

      const sWords = snippetAlpha.split(' ').filter(w => w.length > 0);

      // 1. Extract concept markdown lines
      const lines = (topic.content || '').split('\n');
      let inConcept = false;
      const conceptLines = [];
      for (const line of lines) {
        const m = line.match(/^##\s*(\d+)\.\s*(.*)/);
        if (m) {
          if (parseInt(m[1]) === conceptNum) {
            inConcept = true;
          } else if (inConcept) {
            break;
          }
        } else if (inConcept) {
          conceptLines.push(line);
        }
      }

      // 2. Check for markdown tables in concept (and track line position)
      const tables = [];
      let curTableLines = [];
      let curTableStartLine = -1;
      conceptLines.forEach((l, lineIdx) => {
        if (l.trim().startsWith('|')) {
          if (curTableLines.length === 0) curTableStartLine = lineIdx;
          curTableLines.push(l.trim());
        } else if (curTableLines.length > 0) {
          tables.push({ lines: curTableLines, startLine: curTableStartLine });
          curTableLines = [];
          curTableStartLine = -1;
        }
      });
      if (curTableLines.length > 0) {
        tables.push({ lines: curTableLines, startLine: curTableStartLine });
      }

      let bestTable = null;
      let bestTableCoverage = 0;
      let bestTableLine = -1;
      for (const tblObj of tables) {
        const tbl = tblObj.lines;
        const headerLines = tbl.slice(0, 2);
        const dataRows = tbl.slice(2);
        const fullTableAlpha = toAlphaSnippet(tbl.join('\n'));

        if (snippetAlpha === fullTableAlpha ||
            snippetAlpha.includes(fullTableAlpha) ||
            (fullTableAlpha.includes(snippetAlpha) && snippetAlpha.length > fullTableAlpha.length * 0.6)) {
          bestTable = tbl.join('\n');
          bestTableCoverage = 1.0;
          bestTableLine = tblObj.startLine;
          break;
        }

        const matchingRows = dataRows.filter(row => {
          const rowAlpha = toAlphaSnippet(row);
          return rowAlpha && (snippetAlpha.includes(rowAlpha) || rowAlpha.includes(snippetAlpha));
        });

        if (matchingRows.length > 0 && matchingRows.length >= dataRows.length * 0.3) {
          const subTableMd = [...headerLines, ...matchingRows].join('\n');
          const cov = getAlphaWordCoverage(snippetAlpha, toAlphaSnippet(subTableMd));
          if (cov > bestTableCoverage) {
            bestTableCoverage = cov;
            bestTable = subTableMd;
            const firstRowIdx = tbl.indexOf(matchingRows[0]);
            bestTableLine = tblObj.startLine + Math.max(0, firstRowIdx);
          }
        }

        const cov = getAlphaWordCoverage(snippetAlpha, fullTableAlpha);
        if (cov > 0.75 && cov > bestTableCoverage) {
          bestTableCoverage = cov;
          bestTable = tbl.join('\n');
          bestTableLine = tblObj.startLine;
        }
      }

      // 3. Match lines/paragraphs in concept markdown
      const lineAlphas = conceptLines.map(l => toAlphaSnippet(l));
      let bestStart = -1;
      let bestEnd = -1;
      let bestStartChar = 0;

      // A. Match start phrase (2-5 words)
      for (let n = Math.min(5, sWords.length); n >= 2; n--) {
        const startPhrase = sWords.slice(0, n).join(' ');
        const idx = lineAlphas.findIndex(la => la.includes(startPhrase));
        if (idx !== -1) {
          bestStart = idx;
          bestStartChar = Math.max(0, lineAlphas[idx].indexOf(startPhrase));
          break;
        }
      }

      // B. Match end phrase starting FORWARD from bestStart
      if (bestStart !== -1) {
        for (let n = Math.min(5, sWords.length); n >= 2; n--) {
          const endPhrase = sWords.slice(sWords.length - n).join(' ');
          for (let i = bestStart; i < lineAlphas.length; i++) {
            if (lineAlphas[i].includes(endPhrase)) {
              bestEnd = i;
              break;
            }
          }
          if (bestEnd !== -1) break;
        }
      }

      // C. Fallback / broad word overlap if phrase matching missed
      if (bestStart === -1 || bestEnd === -1 || bestStart > bestEnd) {
        let firstMatch = -1;
        let lastMatch = -1;
        for (let i = 0; i < conceptLines.length; i++) {
          const la = lineAlphas[i];
          if (!la) continue;
          if (snippetAlpha.includes(la) || la.includes(snippetAlpha)) {
            if (firstMatch === -1) firstMatch = i;
            lastMatch = i;
          } else {
            const lWords = la.split(' ');
            let shared = false;
            for (let j = 0; j <= lWords.length - 3; j++) {
              if (snippetAlpha.includes(lWords.slice(j, j + 3).join(' '))) {
                shared = true;
                break;
              }
            }
            if (shared) {
              if (firstMatch === -1) firstMatch = i;
              lastMatch = i;
            }
          }
        }
        if (bestStart === -1 || (firstMatch !== -1 && firstMatch < bestStart)) bestStart = firstMatch;
        if (bestEnd === -1 || (lastMatch !== -1 && lastMatch > bestEnd)) bestEnd = lastMatch;
      }

      let matchedMd = null;
      let mdCoverage = 0;
      let isSubPhrase = false;

      if (bestStart !== -1 && bestEnd !== -1 && bestStart <= bestEnd) {
        let candWords = toAlphaSnippet(conceptLines.slice(bestStart, bestEnd + 1).join(' ')).split(' ').filter(Boolean);
        while (candWords.length < sWords.length * 0.95 && bestEnd < conceptLines.length - 1) {
          bestEnd++;
          candWords = toAlphaSnippet(conceptLines.slice(bestStart, bestEnd + 1).join(' ')).split(' ').filter(Boolean);
        }

        let codeFences = 0;
        for (let i = bestStart; i <= bestEnd; i++) {
          if (/^\s*```/.test(conceptLines[i])) codeFences++;
        }
        while (codeFences % 2 !== 0 && bestEnd < conceptLines.length - 1) {
          bestEnd++;
          if (/^\s*```/.test(conceptLines[bestEnd])) codeFences++;
        }

        if (bestStart === bestEnd) {
          const lineWords = lineAlphas[bestStart].split(' ').filter(Boolean);
          const subRatio = sWords.length / (lineWords.length || 1);
          if (subRatio < 0.65) {
            isSubPhrase = true;
          }
        }

        if (!isSubPhrase) {
          candWords = toAlphaSnippet(conceptLines.slice(bestStart, bestEnd + 1).join(' ')).split(' ').filter(Boolean);
          if (candWords.length <= Math.max(sWords.length * 1.8, sWords.length + 15)) {
            matchedMd = conceptLines.slice(bestStart, bestEnd + 1).join('\n').trim();
            mdCoverage = getAlphaWordCoverage(snippetAlpha, toAlphaSnippet(matchedMd));
          }
        }
      }

      // 4. Match topic.examples (supports SQL-only, Output-only, and SQL+Output combined!)
      let bestEx = null;
      let bestExIdx = -1;
      let exCoverage = 0;
      const cleanOutQuery = snippetAlpha.replace(/^output\s+/, '').trim();
      const exList = (topic.examples && topic.examples[conceptNum]) || [];

      exList.forEach((ex, exIdx) => {
        const sqlAlpha = toAlphaSnippet(ex.sql || '');
        const outAlpha = toAlphaSnippet(ex.output || '');
        const combinedAlpha = (sqlAlpha + ' ' + outAlpha).trim();

        const covCombined = getAlphaWordCoverage(snippetAlpha, combinedAlpha);
        const covSql = sqlAlpha ? getAlphaWordCoverage(snippetAlpha, sqlAlpha) : 0;
        const covOut = outAlpha ? getAlphaWordCoverage(cleanOutQuery, outAlpha) : 0;

        let score = Math.max(covCombined, covSql, covOut);
        if (outAlpha && (cleanOutQuery === outAlpha || outAlpha.includes(cleanOutQuery) || cleanOutQuery.includes(outAlpha))) {
          score = Math.max(score, 0.99);
        }
        if (sqlAlpha && (snippetAlpha === sqlAlpha || sqlAlpha.includes(snippetAlpha) || snippetAlpha.includes(sqlAlpha))) {
          score = Math.max(score, 0.99);
        }

        if (score > exCoverage) {
          exCoverage = score;
          bestEx = ex;
          bestExIdx = exIdx;
        }
      });

      let matchesSql = false;
      let matchesOut = false;
      if (bestEx) {
        const sqlAlpha = toAlphaSnippet(bestEx.sql || '');
        const outAlpha = toAlphaSnippet(bestEx.output || '');
        const sqlExactOrSub = !!(sqlAlpha && (sqlAlpha === snippetAlpha || sqlAlpha.includes(snippetAlpha) || snippetAlpha.includes(sqlAlpha)));
        const outExactOrSub = !!(outAlpha && (outAlpha === cleanOutQuery || outAlpha.includes(cleanOutQuery) || cleanOutQuery.includes(outAlpha)));
        const isSqlKeywordStart = /^\s*(--|\/\*|(?:\b(?:SELECT|INSERT|UPDATE|DELETE|CREATE|ALTER|DROP|MERGE|GRANT|REVOKE|DECLARE|BEGIN)\b))/i.test(snippet);

        matchesSql = sqlExactOrSub || (!!sqlAlpha && getAlphaWordCoverage(snippetAlpha, sqlAlpha) >= 0.75 && !outExactOrSub) || (!outExactOrSub && isSqlKeywordStart);
        matchesOut = outExactOrSub || (!!outAlpha && getAlphaWordCoverage(cleanOutQuery, outAlpha) >= 0.75 && !sqlExactOrSub);
      }

      // 5. Evaluate final classification and page order score
      if (bestTable && bestTableCoverage >= 0.85 && bestTableCoverage >= mdCoverage && bestTableCoverage >= exCoverage) {
        return {
          kind: 'table',
          bestTable,
          orderScore: (bestTableLine !== -1 ? bestTableLine : 0) * 10000
        };
      }

      if (!isSubPhrase && matchedMd && mdCoverage >= 0.85 && mdCoverage >= exCoverage) {
        return {
          kind: 'markdown',
          matchedMd,
          orderScore: bestStart * 10000 + bestStartChar
        };
      }

      if (!isSubPhrase && bestEx && exCoverage >= 0.75) {
        return {
          kind: 'example',
          bestEx,
          bestExIdx,
          matchesSql,
          matchesOut,
          orderScore: 1000000 + bestExIdx * 100 + (matchesSql ? 0 : 10)
        };
      }

      if (!isSubPhrase && matchedMd && mdCoverage >= 0.7) {
        return {
          kind: 'markdown',
          matchedMd,
          orderScore: bestStart * 10000 + bestStartChar
        };
      }

      // Fallback order score (covers sub-phrases within lines or partial example matches)
      let fallbackScore = 99999999;
      if (bestStart !== -1 && (bestExIdx === -1 || mdCoverage >= exCoverage || isSubPhrase)) {
        fallbackScore = bestStart * 10000 + bestStartChar;
      } else if (bestExIdx !== -1 && exCoverage >= 0.5) {
        fallbackScore = 1000000 + bestExIdx * 100 + (matchesSql ? 0 : 10);
      }
      return { kind: 'fallback', orderScore: fallbackScore };
    }

    function sortConceptSnippetsInPageOrder(snippets, topic, conceptNum) {
      if (!Array.isArray(snippets) || snippets.length <= 1 || !topic) return snippets;
      return snippets
        .map((s, idx) => {
          const analysis = analyzeRevisionSnippet(s, topic, conceptNum);
          return { s, idx, score: analysis ? analysis.orderScore : 99999999 };
        })
        .sort((a, b) => a.score - b.score || a.idx - b.idx)
        .map(item => item.s);
    }

    function getAllHighlightsData() {
      const helpers = window.StageGateSyncHelpers;
      const result = [];
      let totalCount = 0;

      topics.forEach((topic, topicIdx) => {
        const conceptsMap = [];
        const lines = topic.content.split('\n');
        lines.forEach(line => {
          const m = line.match(/^##\s*(\d+)\.\s*(.*)/);
          if (m) {
            conceptsMap.push({
              num: parseInt(m[1]),
              title: m[2].trim()
            });
          }
        });

        const topicConcepts = [];

        conceptsMap.forEach(c => {
          const storageKey = `stage_gate_highlights_${topic.id}_${c.num}`;
          let list = [];
          try {
            list = JSON.parse(localStorage.getItem(storageKey) || '[]');
          } catch (e) {
            list = [];
          }
          if (Array.isArray(list) && list.length > 0) {
            const cleanList = helpers ? helpers.dedupeHighlightsList(list) : list;

            if (cleanList.length !== list.length) {
              localStorage.setItem(storageKey, JSON.stringify(cleanList));
              if (window.__hasReceivedInitialSnapshot && window.StageGateSync && window.StageGateSync.saveHighlights) {
                window.StageGateSync.saveHighlights(storageKey, cleanList);
              }
            }

            if (cleanList.length > 0) {
              const orderedList = sortConceptSnippetsInPageOrder(cleanList, topic, c.num);
              totalCount += 1; // Count unique concepts, not individual paragraphs!
              topicConcepts.push({
                conceptNum: c.num,
                conceptTitle: `${c.num}. ${c.title}`,
                snippets: orderedList,
                storageKey: storageKey
              });
            }
          }
        });

        if (topicConcepts.length > 0) {
          result.push({
            topicId: topic.id,
            topicIndex: topicIdx,
            topicTitle: topic.title,
            concepts: topicConcepts
          });
        }
      });

      return { topics: result, totalCount: totalCount };
    }

    async function removeSnippetFromRevisionSheet(topicId, conceptNum, snippet, btn) {
      const card = btn ? btn.closest('.snippet-card') : null;

      // 1. Immediately switch button to visible Loading State and dim the card
      if (btn) {
        btn.disabled = true;
        btn.style.pointerEvents = 'none';
        btn.className = 'remove-revision-snippet-btn px-2 py-1 rounded-md bg-amber-500/10 text-amber-400 border border-amber-500/30 text-[11px] font-medium flex items-center gap-1.5 cursor-wait';
        btn.innerHTML = `
          <svg class="animate-spin w-3 h-3 text-amber-400 shrink-0" viewBox="0 0 24 24" fill="none">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
          </svg>
          <span>Removing...</span>
        `;
      }
      if (card) {
        card.style.transition = 'opacity 0.2s ease';
        card.style.opacity = '0.4';
      }

      // 2. Remove from storage & await cloud sync
      await removeSnippet(topicId, conceptNum, snippet, false);

      if (!card || !card.isConnected) {
        loadHardRevision(false);
        return;
      }

      // Also prune any other sibling cards in this concept whose stored highlight was removed (e.g., overlapping subsets)
      const storageKey = `stage_gate_highlights_${topicId}_${conceptNum}`;
      let remainingNorms = new Set();
      try {
        const cur = JSON.parse(localStorage.getItem(storageKey) || '[]');
        const normFn = window.StageGateSyncHelpers ? window.StageGateSyncHelpers.normalize : (s => (s || '').replace(/\s+/g, ' ').trim());
        remainingNorms = new Set(cur.map(normFn));
      } catch (e) {}

      // 3. Briefly show 'Removed' checkmark on button
      if (btn) {
        btn.className = 'remove-revision-snippet-btn px-2 py-1 rounded-md bg-emerald-500/10 text-emerald-400 border border-emerald-500/30 text-[11px] font-medium flex items-center gap-1.5';
        btn.innerHTML = `
          <svg class="w-3 h-3 text-emerald-400 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <polyline points="20 6 9 17 4 12"/>
          </svg>
          <span>Removed!</span>
        `;
      }

      await new Promise(r => setTimeout(r, 260));

      // 4. Animate out the card smoothly in DOM without touching page scroll
      card.style.transition = 'opacity 0.2s cubic-bezier(0.4, 0, 0.2, 1), transform 0.2s cubic-bezier(0.4, 0, 0.2, 1), max-height 0.22s ease, margin 0.22s ease, padding 0.22s ease';
      card.style.maxHeight = `${card.offsetHeight}px`;
      card.style.overflow = 'hidden';

      requestAnimationFrame(() => {
        card.style.opacity = '0';
        card.style.transform = 'translateX(16px)';
        card.style.maxHeight = '0px';
        card.style.paddingTop = '0px';
        card.style.paddingBottom = '0px';
        card.style.marginTop = '0px';
        card.style.marginBottom = '0px';
      });

      setTimeout(() => {
        const snippetList = card.closest('.snippet-list');
        const conceptBlock = card.closest('.concept-block');
        const topicCard = card.closest('.topic-card');

        card.remove();

        // Remove any sibling cards in the same concept block that are no longer in localStorage
        if (snippetList) {
          const normFn = window.StageGateSyncHelpers ? window.StageGateSyncHelpers.normalize : (s => (s || '').replace(/\s+/g, ' ').trim());
          snippetList.querySelectorAll('.snippet-card').forEach(sibCard => {
            const sibBtn = sibCard.querySelector('.remove-revision-snippet-btn');
            if (sibBtn) {
              const sibSnip = normFn(sibBtn.getAttribute('data-snippet'));
              if (sibSnip && !remainingNorms.has(sibSnip)) {
                sibCard.remove();
              }
            }
          });
        }

        // If no more snippets in this concept, prune concept block
        if (snippetList && snippetList.querySelectorAll('.snippet-card').length === 0) {
          if (conceptBlock) conceptBlock.remove();
        }

        // If no more concepts in this topic, prune topic card
        if (topicCard) {
          const remainingConcepts = topicCard.querySelectorAll('.concept-block');
          if (remainingConcepts.length === 0) {
            topicCard.remove();
          }
        }

        // If no cards left across the entire sheet, render the empty state without scrolling to top
        const remainingCards = contentContainer.querySelectorAll('.snippet-card');
        if (remainingCards.length === 0) {
          loadHardRevision(false);
        }
      }, 230);
    }

    function formatExampleOutputHtml(outputText, includeLabel = true) {
      const isTabular = /-{3,}/.test(outputText || '');
      const cls = isTabular ? 'example-output-text' : 'example-output-text example-output-prose';
      const labelHtml = includeLabel ? '<div class="example-output-label">OUTPUT</div>' : '';
      return `${labelHtml}<pre class="${cls}">${escapeHtml(outputText)}</pre>`;
    }

    function formatSqlMarkdownHtml(codeStr) {
      let codeToRender = (codeStr || '').trim();
      if (/^\s*--/.test(codeToRender) && !codeToRender.includes('\n')) {
        codeToRender = codeToRender.replace(/^(\s*--[^\n]*?)\s+(SELECT|INSERT|UPDATE|DELETE|CREATE|ALTER|DROP|MERGE|WITH)\b/i, '$1\n$2');
      }
      return marked.parse('```sql\n' + codeToRender + '\n```');
    }

    function renderRevisionSnippetContent(snippet, topicId, conceptNum) {
      if (!snippet) return { isTable: false, html: '' };

      const topic = topics.find(t => t.id === topicId);
      const analysis = topic ? analyzeRevisionSnippet(snippet, topic, conceptNum) : null;

      if (analysis) {
        if (analysis.kind === 'table' && analysis.bestTable) {
          return {
            isTable: true,
            html: `<div class="markdown-body w-full">${marked.parse(analysis.bestTable)}</div>`
          };
        }

        if (analysis.kind === 'markdown' && analysis.matchedMd) {
          return {
            isTable: false,
            html: `<div class="markdown-body text-xs text-white font-normal leading-relaxed">${marked.parse(analysis.matchedMd)}</div>`
          };
        }

        if (analysis.kind === 'example' && analysis.bestEx) {
          const ex = analysis.bestEx;
          if (analysis.matchesSql && analysis.matchesOut && ex.output) {
            return {
              isTable: false,
              html: `<div class="markdown-body text-xs text-white font-normal leading-relaxed">${formatSqlMarkdownHtml(ex.sql || snippet)}${formatExampleOutputHtml(ex.output, true)}</div>`
            };
          }
          if (analysis.matchesSql) {
            return {
              isTable: false,
              html: `<div class="markdown-body text-xs text-white font-normal leading-relaxed">${formatSqlMarkdownHtml(ex.sql || snippet)}</div>`
            };
          }
          if (analysis.matchesOut && ex.output) {
            return {
              isTable: false,
              html: `<div class="markdown-body text-xs text-white font-normal leading-relaxed">${formatExampleOutputHtml(ex.output, true)}</div>`
            };
          }
          return {
            isTable: false,
            html: `<div class="markdown-body text-xs text-white font-normal leading-relaxed">${formatExampleOutputHtml(snippet, false)}</div>`
          };
        }
      }

      // 5. Fallback & Sub-phrase: Display exact highlighted snippet
      const isSqlRegex = /^\s*(--|\/\*|(?:\b(?:SELECT|INSERT|UPDATE|DELETE|CREATE|ALTER|DROP|MERGE|GRANT|REVOKE|DECLARE|BEGIN)\b))/i;
      if (isSqlRegex.test(snippet)) {
        return {
          isTable: false,
          html: `<div class="markdown-body text-xs text-white font-normal leading-relaxed">${formatSqlMarkdownHtml(snippet)}</div>`
        };
      }

      return {
        isTable: false,
        html: `<div class="text-xs text-white font-normal leading-relaxed whitespace-pre-wrap">${escapeHtml(snippet)}</div>`
      };
    }

    window.generateHardRevisionBackupText = function() {
      const data = getAllHighlightsData();
      const now = new Date();
      const dateStr = now.toISOString().slice(0, 10);

      let md = `# Stage Gate — Hard Revision Sheet Backup\n\n`;
      md += `> **Export Date:** ${now.toLocaleString()}  \n`;
      md += `> **Total Saved Concepts:** ${data.totalCount}  \n`;
      md += `> **Purpose:** Deloitte Stage Gate Pre-Exam Review & Highlights Safety Backup\n\n`;
      md += `---\n\n`;

      const backupPayload = {};

      data.topics.forEach(t => {
        md += `## ${t.topicTitle}\n\n`;
        t.concepts.forEach(c => {
          md += `### ${c.conceptTitle}\n\n`;
          backupPayload[c.storageKey] = c.snippets;
          c.snippets.forEach(s => {
            const trimmed = (s || '').trim();
            if (trimmed.startsWith('|') || trimmed.includes('\n')) {
              md += `${trimmed}\n\n`;
            } else {
              md += `> ${trimmed}\n\n`;
            }
          });
        });
        md += `---\n\n`;
      });

      md += `\n<!-- STAGE_GATE_BACKUP_METADATA\n${JSON.stringify({
        version: 1,
        exportedAt: now.toISOString(),
        totalConcepts: data.totalCount,
        keys: backupPayload
      }, null, 2)}\n-->\n`;

      return { text: md, dateStr: dateStr, count: data.totalCount };
    };

    window.restoreHardRevisionFromFile = function(file) {
      if (!window.isAdminAuthenticated || !file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const content = e.target.result || '';
          let keysToSave = {};

          const metaMatch = content.match(/<!--\s*STAGE_GATE_BACKUP_METADATA\s*([\s\S]*?)\s*-->/);
          if (metaMatch && metaMatch[1]) {
            try {
              const parsed = JSON.parse(metaMatch[1]);
              if (parsed && parsed.keys) {
                keysToSave = parsed.keys;
              }
            } catch (err) {
              console.warn('Metadata parse warning:', err);
            }
          }

          if (Object.keys(keysToSave).length === 0) {
            try {
              const parsed = JSON.parse(content);
              if (parsed && typeof parsed === 'object') {
                keysToSave = parsed.keys || parsed;
              }
            } catch (err) {}
          }

          let restoredCount = 0;
          const helpers = window.StageGateSyncHelpers;
          const restoreTs = Date.now();
          for (const [key, snippets] of Object.entries(keysToSave)) {
            if (key.startsWith('stage_gate_highlights_') && Array.isArray(snippets) && snippets.length > 0) {
              const cleaned = helpers ? helpers.dedupeHighlightsList(snippets) : snippets;
              if (cleaned.length > 0) {
                if (helpers) {
                  cleaned.forEach(s => helpers.recordAdd(key, s, [], restoreTs));
                }
                localStorage.setItem(key, JSON.stringify(cleaned));
                if (window.StageGateSync && window.StageGateSync.saveHighlights) {
                  window.StageGateSync.saveHighlights(key, cleaned, restoreTs);
                }
                restoredCount++;
              }
            }
          }

          if (restoredCount > 0) {
            alert(`Success! Restored ${restoredCount} concept highlight(s) into your Hard Revision sheet.`);
            window.updateHardRevisionBadges();
            window.loadHardRevision(false);
          } else {
            alert("No valid Stage Gate highlight backup data was found in this file.");
          }
        } catch (err) {
          alert("Error processing backup file: " + err.message);
        }
      };
      reader.readAsText(file);
    };

                <div class="space-y-2 snippet-list">
            `;

            c.snippets.forEach((s, sIdx) => {
              const cardId = `rev-card-${t.topicId}-${c.conceptNum}-${sIdx}`;
              const rendered = renderRevisionSnippetContent(s, t.topicId, c.conceptNum);
              if (rendered.isTable) {
                html += `
                  <div id="${cardId}" data-card-id="${cardId}" class="snippet-card group relative p-3 sm:p-3.5 rounded-xl bg-zinc-900/90 border border-zinc-800/90 transition-all flex flex-col justify-between gap-2.5 overflow-hidden">
                    <div class="flex items-center justify-between gap-2 pb-1.5 border-b border-zinc-800/60">
                      <span class="text-[11px] font-semibold text-emerald-400 uppercase tracking-wider flex items-center gap-1.5">
                        <svg class="w-3.5 h-3.5 text-emerald-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3h18v18H3zM3 9h18M3 15h18M9 3v18M15 3v18"/></svg>
                        <span>Comparison Table</span>
                      </span>
                      <div class="flex items-center gap-1.5 shrink-0">
                        <button type="button" class="jump-to-concept-btn px-2 py-1 rounded-md bg-zinc-800 hover:bg-zinc-700 text-zinc-300 hover:text-white text-[11px] font-medium transition cursor-pointer flex items-center gap-1" data-topic-index="${t.topicIndex}" data-concept="${c.conceptNum}" data-card-id="${cardId}">
                          <span>Context</span>
                        </button>
                        ${window.isAdminAuthenticated ? `
                        <button type="button" class="remove-revision-snippet-btn px-2 py-1 rounded-md bg-zinc-800 hover:bg-red-500/20 text-zinc-400 hover:text-red-400 border border-transparent hover:border-red-500/30 text-[11px] font-medium transition cursor-pointer flex items-center gap-1" data-topic="${escapeHtml(t.topicId)}" data-concept="${c.conceptNum}" data-snippet="${escapeHtml(s)}">
                          <svg class="w-3 h-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg>
                          <span>Remove</span>
                        </button>
                        ` : ''}
                      </div>
                    </div>

                    <div class="w-full overflow-x-auto">
                      ${rendered.html}
                    </div>
                  </div>
                `;
              } else {
                html += `
                  <div id="${cardId}" data-card-id="${cardId}" class="snippet-card group relative p-3 sm:p-3.5 rounded-xl bg-zinc-900/90 border border-zinc-800/90 transition-all flex flex-col sm:flex-row sm:items-start justify-between gap-3">
                    <div class="flex-1 min-w-0">
                      ${rendered.html}
                    </div>

                    <div class="flex items-center gap-1.5 shrink-0 self-end sm:self-start pt-1 sm:pt-0">
                      <button type="button" class="jump-to-concept-btn px-2 py-1 rounded-md bg-zinc-800 hover:bg-zinc-700 text-zinc-300 hover:text-white text-[11px] font-medium transition cursor-pointer flex items-center gap-1" data-topic-index="${t.topicIndex}" data-concept="${c.conceptNum}" data-card-id="${cardId}">
                        <span>Context</span>
                      </button>
                      ${window.isAdminAuthenticated ? `
                      <button type="button" class="remove-revision-snippet-btn px-2 py-1 rounded-md bg-zinc-800 hover:bg-red-500/20 text-zinc-400 hover:text-red-400 border border-transparent hover:border-red-500/30 text-[11px] font-medium transition cursor-pointer flex items-center gap-1" data-topic="${escapeHtml(t.topicId)}" data-concept="${c.conceptNum}" data-snippet="${escapeHtml(s)}">
                        <svg class="w-3 h-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg>
                        <span>Remove</span>
                      </button>
                      ` : ''}
                    </div>
                  </div>
                `;
              }
            });

            html += `
                </div>
              </div>
            `;
          });

          html += `
              </div>
            </div>
          `;
        });

        html += `</div>`;
        contentContainer.innerHTML = html;

        // Syntax highlight any pre code blocks in revision cards
        contentContainer.querySelectorAll('pre code').forEach((el) => {
          try { hljs.highlightElement(el); } catch (err) {}
        });
      }

      // Attach button event listeners
      contentContainer.querySelectorAll('.jump-to-concept-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.preventDefault();
          e.stopPropagation();
          const topicIndex = parseInt(btn.getAttribute('data-topic-index'));
          const conceptNum = parseInt(btn.getAttribute('data-concept'));
          const cardId = btn.getAttribute('data-card-id');
          jumpToConcept(topicIndex, conceptNum, {
            scrollY: window.scrollY,
            cardId: cardId,
            topicIndex: topicIndex,
            conceptNum: conceptNum
          });
        });
      });

      contentContainer.querySelectorAll('.remove-revision-snippet-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.preventDefault();
          e.stopPropagation();
          const topicId = btn.getAttribute('data-topic');
          const conceptNum = parseInt(btn.getAttribute('data-concept'));
          const snippet = btn.getAttribute('data-snippet');
          removeSnippetFromRevisionSheet(topicId, conceptNum, snippet, btn);
        });
      });

      // Update footer
      const topicNavFooter = document.getElementById('topicNavFooter');
      if (topicNavFooter) {
        const backIdx = (typeof currentTopicIndex === 'number' && currentTopicIndex >= 0 && currentTopicIndex < topics.length) ? currentTopicIndex : 0;
        topicNavFooter.innerHTML = `
          <button onclick="loadTopic(${backIdx})" class="flex items-center gap-1.5 px-3.5 py-2 rounded-lg bg-zinc-900 hover:bg-zinc-800 border border-zinc-800 text-xs font-medium text-zinc-300 hover:text-white transition cursor-pointer">
            <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5m7 7-7-7 7-7"/></svg>
            <span>Back to Topic Notes</span>
          </button>
          <span class="text-xs text-zinc-500 font-mono">Live Focus Sync Enabled</span>
        `;
      }

      if (targetCardId) {
        setTimeout(() => {
          const targetCard = document.getElementById(targetCardId);
          if (targetCard) {
            targetCard.scrollIntoView({ behavior: 'smooth', block: 'center' });
            targetCard.classList.add('transition-all', 'duration-500', 'ring-2', 'ring-emerald-400', 'ring-offset-4', 'ring-offset-black');
            setTimeout(() => {
              targetCard.classList.remove('ring-2', 'ring-emerald-400', 'ring-offset-4', 'ring-offset-black');
            }, 2500);
          } else if (typeof fallbackScrollY === 'number') {
            window.scrollTo({ top: fallbackScrollY, behavior: 'smooth' });
          }
        }, 60);
      } else if (shouldScroll) {
        window.scrollTo({ top: 0, behavior: 'smooth' });
      } else {
        window.scrollTo({ top: prevScrollY, behavior: 'instant' });
      }
    };

    const headerHardRevisionBtn = document.getElementById('headerHardRevisionBtn');
    const sidebarHardRevisionBtn = document.getElementById('sidebarHardRevisionBtn');

    if (headerHardRevisionBtn) {
      headerHardRevisionBtn.addEventListener('click', () => {
        if (window.lastRevisionJump) {
          returnToHardRevisionLocation();
        } else {
          loadHardRevision(true);
        }
      });
    }
    if (sidebarHardRevisionBtn) {
      sidebarHardRevisionBtn.addEventListener('click', () => {
        if (window.lastRevisionJump) {
          returnToHardRevisionLocation();
        } else {
          loadHardRevision(true);
        }
        closeSidebar();
      });
    }

    // Restore active view (Topic or Hard Revision) across page reloads
    function restoreInitialView() {
      renderNav();
      updateHardRevisionBadges();

      const hash = (location.hash || '').replace(/^#/, '').trim();
      let restored = false;

      if (hash === 'hard-revision') {
        loadHardRevision(true);
        restored = true;
      } else if (hash === 'practicals') {
        loadPracticalsView();
        restored = true;
      } else if (hash) {
        const foundIdx = topics.findIndex(t => t.id === hash || ('topic-' + t.id) === hash);
        if (foundIdx !== -1) {
          loadTopic(foundIdx);
          restored = true;
        }
      }

      if (!restored) {
        const savedView = localStorage.getItem('stage_gate_active_view');
        if (savedView === 'hard-revision') {
          loadHardRevision(true);
          restored = true;
        } else if (savedView === 'practicals') {
          loadPracticalsView();
          restored = true;
        } else if (savedView !== null) {
          const idx = parseInt(savedView, 10);
          if (!isNaN(idx) && idx >= 0 && idx < topics.length) {
            loadTopic(idx);
            restored = true;
          }
        }
      }

      if (!restored) {
        loadTopic(0);
      }

      lucide.createIcons();
    }

    restoreInitialView();

    // Admin Login Modal & Auth Button Wiring
    (function setupAdminAuthUI() {
      const authBtn = document.getElementById('headerAuthBtn');
      const modal = document.getElementById('adminLoginModal');
      const closeBtn = document.getElementById('closeAdminLoginBtn');
      const cancelBtn = document.getElementById('cancelAdminLoginBtn');
      const form = document.getElementById('adminLoginForm');
      const emailInput = document.getElementById('adminLoginEmail');
      const passInput = document.getElementById('adminLoginPassword');
      const errBox = document.getElementById('adminLoginError');
      const submitBtn = document.getElementById('adminLoginSubmitBtn');

      function openModal() {
        if (!modal) return;
        if (errBox) errBox.classList.add('hidden');
        modal.classList.remove('hidden');
        modal.classList.add('flex');
        setTimeout(() => { if (emailInput) emailInput.focus(); }, 50);
      }

      function closeModal() {
        if (!modal) return;
        modal.classList.add('hidden');
        modal.classList.remove('flex');
        if (passInput) passInput.value = '';
        if (errBox) errBox.classList.add('hidden');
      }

      if (authBtn) {
        authBtn.addEventListener('click', async () => {
          if (window.isAdminAuthenticated) {
            if (confirm('Sign out of Admin mode? You will return to read-only mode.')) {
              if (window.StageGateAuth) await window.StageGateAuth.logout();
            }
          } else {
            openModal();
          }
        });
      }

      if (closeBtn) closeBtn.addEventListener('click', closeModal);
      if (cancelBtn) cancelBtn.addEventListener('click', closeModal);
      if (modal) {
        modal.addEventListener('click', (e) => {
          if (e.target === modal) closeModal();
        });
      }
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && modal && !modal.classList.contains('hidden')) {
          closeModal();
        }
      });

      if (form) {
        form.addEventListener('submit', async (e) => {
          e.preventDefault();
          if (!window.StageGateAuth) return;
          const idVal = emailInput ? emailInput.value : '';
          const passVal = passInput ? passInput.value : '';
          if (errBox) errBox.classList.add('hidden');
          if (submitBtn) {
            submitBtn.disabled = true;
            submitBtn.textContent = 'Signing in...';
          }
          try {
            await window.StageGateAuth.login(idVal, passVal);
            closeModal();
          } catch (err) {
            if (errBox) {
              errBox.textContent = (err && err.code === 'auth/invalid-credential')
                ? 'Invalid Admin ID or Password.'
                : (err.message || 'Sign in failed.');
              errBox.classList.remove('hidden');
            }
          } finally {
            if (submitBtn) {
              submitBtn.disabled = false;
              submitBtn.textContent = 'Sign In';
            }
          }
        });
      }
    })();

    
    let currentPracticalCategory = 'All';
    let practicalSearchQuery = '';

    window.setPracticalCategory = function(cat) {
      currentPracticalCategory = cat;
      renderPracticalsContent();
    };

    window.copyCode = function(slot, ev) {
      const practicals = window.STAGE_GATE_PRACTICALS || [];
      const p = practicals.find(item => item.slot === slot);
      if (!p) return;
      navigator.clipboard.writeText(p.solution).then(() => {
        const btn = ev.currentTarget || ev.target.closest('button');
        if (btn) {
          const span = btn.querySelector('span');
          const oldText = span ? span.textContent : '';
          if (span) span.textContent = 'Copied!';
          setTimeout(() => {
            if (span) span.textContent = oldText || 'Copy SQL';
          }, 1500);
        }
      }).catch(err => console.error('Copy failed:', err));
    };

    function loadPracticalsView() {
      window.isHardRevisionActive = false;
      window.isPracticalsActive = true;
      hideRevisionReturnButton();

      try {
        localStorage.setItem('stage_gate_active_view', 'practicals');
        if (history.replaceState) {
          history.replaceState(null, '', '#practicals');
        } else {
          location.hash = 'practicals';
        }
      } catch (e) {}

      topicBadge.classList.remove('hidden');
      topicBadge.textContent = 'PRACTICAL QUESTIONS';
      currentTopicTitle.textContent = 'Practical Questions & Solutions';

      if (downloadRevisionBtn) {
        downloadRevisionBtn.classList.add('hidden');
        downloadRevisionBtn.classList.remove('flex');
      }

      renderNav();
      renderPracticalsContent();
      window.scrollTo({ top: 0, behavior: 'instant' });
    }

    function renderPracticalsContent() {
      const practicals = window.STAGE_GATE_PRACTICALS || [];
      const categories = ['All', 'WHERE Clause', 'Functions & Dates', 'Aggregation', 'Joins', 'Subqueries', 'Set Operators', 'DML & MERGE', 'DDL & Views', 'Window Functions'];

      let filtered = practicals;
      if (currentPracticalCategory !== 'All') {
        filtered = filtered.filter(p => p.category === currentPracticalCategory);
      }
      if (practicalSearchQuery) {
        const q = practicalSearchQuery.toLowerCase();
        filtered = filtered.filter(p => 
          (p.slot && p.slot.toLowerCase().includes(q)) ||
          (p.conceptId && p.conceptId.toLowerCase().includes(q)) ||
          (p.conceptTitle && p.conceptTitle.toLowerCase().includes(q)) ||
          (p.prompt && p.prompt.toLowerCase().includes(q)) ||
          (p.schema && p.schema.toLowerCase().includes(q)) ||
          (p.solution && p.solution.toLowerCase().includes(q)) ||
          (p.trap && p.trap.toLowerCase().includes(q))
        );
      }

      const pillsHtml = categories.map(cat => {
        const count = cat === 'All' ? practicals.length : practicals.filter(p => p.category === cat).length;
        const isActive = cat === currentPracticalCategory;
        return `
          <button 
            type="button" 
            onclick="setPracticalCategory('${cat}')" 
            class="px-2.5 py-1 rounded-lg text-xs font-medium transition cursor-pointer shrink-0 ${isActive ? 'bg-amber-500/20 text-amber-300 border border-amber-500/40 font-semibold shadow-sm' : 'bg-zinc-900 text-zinc-400 hover:text-white border border-zinc-800'}"
          >
            ${cat} (${count})
          </button>
        `;
      }).join('');

      const cardsHtml = filtered.length === 0 ? `
        <div class="py-12 text-center text-zinc-500 text-sm bg-zinc-900/30 rounded-xl border border-zinc-800">
          No practical questions match your search or filter.
        </div>
      ` : filtered.map(p => {
        const safePrompt = marked ? marked.parse(p.prompt) : p.prompt;
        const safeTrap = marked ? marked.parse(p.trap) : p.trap;
        const escapedSolution = (p.solution || '').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        const cleanSchema = (p.schema || '').replace(/`/g, '');

        return `
          <div class="rounded-xl bg-zinc-950 border border-zinc-800/80 p-4 sm:p-5 shadow space-y-3.5" id="drill-card-${p.slot}">
            
            <!-- Header: Question Number & Concept Badge -->
            <div class="flex items-center justify-between gap-2 border-b border-zinc-800/70 pb-2.5">
              <div class="flex items-center gap-2 flex-wrap">
                <span class="font-bold text-sm text-white">Question ${p.slot}</span>
                <span class="text-xs px-2 py-0.5 rounded bg-zinc-900 text-zinc-400 border border-zinc-800 font-mono">Concept ${p.conceptId}</span>
                <span class="text-xs px-2 py-0.5 rounded bg-amber-500/10 text-amber-400 border border-amber-500/20 font-medium">${p.category}</span>
              </div>

              <button 
                type="button" 
                onclick="copyCode('${p.slot}', event)" 
                class="copy-sql-btn px-2.5 py-1 rounded-lg bg-zinc-900 hover:bg-zinc-800 border border-zinc-700 text-zinc-300 hover:text-white text-xs font-mono transition flex items-center gap-1.5 cursor-pointer shrink-0"
              >
                <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
                  <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
                </svg>
                <span>Copy SQL</span>
              </button>
            </div>

            <!-- Question Task -->
            <div>
              <div class="text-[11px] font-semibold uppercase tracking-wider text-zinc-400 mb-1">Question</div>
              <div class="text-sm text-zinc-200 leading-relaxed font-normal prose prose-invert max-w-none">${safePrompt}</div>
            </div>

            <!-- Schema -->
            <div class="bg-zinc-900/50 rounded-lg p-2.5 border border-zinc-800/60 text-xs font-mono text-emerald-400/90 whitespace-pre-wrap break-all">
              <span class="text-zinc-500 font-sans font-semibold mr-1.5 uppercase text-[10px]">Schema:</span>${cleanSchema}
            </div>

            <!-- Solution -->
            <div>
              <div class="text-[11px] font-semibold uppercase tracking-wider text-amber-400/90 mb-1">Oracle SQL Solution</div>
              <div class="rounded-lg overflow-hidden border border-zinc-800 bg-[#0d1117]">
                <pre class="p-3 text-xs font-mono overflow-x-auto text-zinc-100"><code class="language-sql">${escapedSolution}</code></pre>
              </div>
            </div>

            <!-- Explanation & Trap -->
            <div class="rounded-lg bg-zinc-900/50 border border-zinc-800 p-3 text-xs text-zinc-300 leading-relaxed">
              <div class="font-semibold text-amber-400/90 text-xs mb-1">Explanation & Exam Trap:</div>
              <div class="prose prose-invert max-w-none text-xs text-zinc-300 leading-relaxed">${safeTrap}</div>
            </div>

          </div>
        `;
      }).join('');

      contentContainer.innerHTML = `
        <div class="max-w-4xl mx-auto space-y-5 pb-16 pt-1">
          
          <!-- Sticky Search & Category Bar (No large banner) -->
          <div class="space-y-2.5 sticky top-14 z-30 bg-black/95 backdrop-blur-md py-2 border-b border-zinc-800">
            <div class="relative w-full">
              <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-zinc-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="8"/>
                <line x1="21" y1="21" x2="16.65" y2="16.65"/>
              </svg>
              <input 
                id="practicalsSearchInput" 
                type="text" 
                value="${practicalSearchQuery}" 
                placeholder="Search 41 practical questions..." 
                class="w-full bg-zinc-900 border border-zinc-800 rounded-xl pl-9 pr-4 py-2 text-xs sm:text-sm text-white placeholder-zinc-500 focus:outline-none focus:border-amber-500 transition"
              >
            </div>

            <div class="flex items-center gap-1.5 overflow-x-auto pb-1 scrollbar-none">
              ${pillsHtml}
            </div>
          </div>

          <!-- Normal Questions & Solutions List -->
          <div class="space-y-4">
            ${cardsHtml}
          </div>

        </div>
      `;

      const sInput = document.getElementById('practicalsSearchInput');
      if (sInput) {
        sInput.addEventListener('input', (e) => {
          practicalSearchQuery = e.target.value.trim();
          renderPracticalsContent();
          const nextInput = document.getElementById('practicalsSearchInput');
          if (nextInput) {
            nextInput.focus();
            nextInput.selectionStart = nextInput.selectionEnd = nextInput.value.length;
          }
        });
      }

      if (window.hljs) {
        contentContainer.querySelectorAll('pre code').forEach(el => hljs.highlightElement(el));
      }
      if (window.lucide) {
        lucide.createIcons();
      }
    }

    const headerPracticalsBtn = document.getElementById('headerPracticalsBtn');
    const sidebarPracticalsBtn = document.getElementById('sidebarPracticalsBtn');

    if (headerPracticalsBtn) {
      headerPracticalsBtn.addEventListener('click', () => {
        loadPracticalsView();
      });
    }
    if (sidebarPracticalsBtn) {
      sidebarPracticalsBtn.addEventListener('click', () => {
        loadPracticalsView();
        closeSidebar();
      });
    }

    window.addEventListener('hashchange', () => {
      const hash = (location.hash || '').replace(/^#/, '').trim();
      if (hash === 'hard-revision') {
        if (!window.isHardRevisionActive) loadHardRevision(true);
      } else if (hash === 'practicals') {
        if (!window.isPracticalsActive) loadPracticalsView();
      } else if (hash) {
        const foundIdx = topics.findIndex(t => t.id === hash);
        if (foundIdx !== -1 && (window.isHardRevisionActive || window.isPracticalsActive || currentTopicIndex !== foundIdx)) {
          loadTopic(foundIdx);
        }
      }
    });
  </script>
</body>
</html>
